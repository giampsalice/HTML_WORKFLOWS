name: Aggiorna dati rete corsari

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - ".github/workflows/update-corsari-data.yml"

permissions:
  contents: write

concurrency:
  group: update-corsari-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Scarica i CSV pubblicati da Google Sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          BASE="https://docs.google.com/spreadsheets/d/e/2PACX-1vRxZ1JcJy6VdGQnt3oy0v_xm4tqQSfombk-lw9rS0eQiPDg7_tO-GHxdFPaOR0wHqwdDyCRgYbZZPAZ"
          USER_AGENT="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          COOKIE_JAR="$RUNNER_TEMP/google-cookies.txt"

          # Inizializza una normale sessione anonima. Google talvolta risponde
          # 401 ai client senza cookie anche se la pubblicazione è accessibile
          # da una finestra anonima del browser.
          curl --location --silent --show-error --retry 3 \
            --user-agent "$USER_AGENT" \
            --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            --cookie-jar "$COOKIE_JAR" \
            "$BASE/pubhtml" --output /dev/null

          download_csv() {
            local gid="$1"
            local destination="$2"
            local url="$BASE/pub?gid=$gid&single=true&output=csv"

            if curl --fail-with-body --location --silent --show-error --retry 3 \
              --user-agent "$USER_AGENT" \
              --referer "$BASE/pubhtml" \
              --header "Accept: text/csv,text/plain;q=0.9,*/*;q=0.8" \
              --header "Accept-Language: it-IT,it;q=0.9,en;q=0.7" \
              --cookie "$COOKIE_JAR" --cookie-jar "$COOKIE_JAR" \
              "$url" --output "$destination"; then
              return 0
            fi

            echo "curl non riuscito; secondo tentativo con wget"
            rm -f "$destination"
            wget --quiet --tries=3 --timeout=30 \
              --user-agent="$USER_AGENT" \
              --referer="$BASE/pubhtml" \
              --load-cookies="$COOKIE_JAR" \
              --output-document="$destination" "$url"
          }

          download_csv "378951882" "$RUNNER_TEMP/corsari_nodi.csv"
          download_csv "434015411" "$RUNNER_TEMP/corsari_connessioni.csv"

          test -s "$RUNNER_TEMP/corsari_nodi.csv"
          test -s "$RUNNER_TEMP/corsari_connessioni.csv"
          head -n 1 "$RUNNER_TEMP/corsari_nodi.csv" | grep -Eqi '(^|,)id(,|$)'

          mv "$RUNNER_TEMP/corsari_nodi.csv" data/corsari_nodi.csv
          mv "$RUNNER_TEMP/corsari_connessioni.csv" data/corsari_connessioni.csv

      - name: Pubblica i dati aggiornati
        shell: bash
        run: |
          set -euo pipefail
          git add data/corsari_nodi.csv data/corsari_connessioni.csv
          if git diff --cached --quiet; then
            echo "I dati sono già aggiornati."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna dati rete corsari"
          git push
