name: Aggiorna dati rete corsari

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - ".github/workflows/update-corsari-data.yml"

permissions:
  contents: write

concurrency:
  group: update-corsari-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Scarica i CSV pubblicati da Google Sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data

          curl --fail --location --silent --show-error --retry 3 \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vRxZ1JcJy6VdGQnt3oy0v_xm4tqQSfombk-lw9rS0eQiPDg7_tO-GHxdFPaOR0wHqwdDyCRgYbZZPAZ/pub?gid=378951882&single=true&output=csv" \
            --output "$RUNNER_TEMP/corsari_nodi.csv"

          curl --fail --location --silent --show-error --retry 3 \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vRxZ1JcJy6VdGQnt3oy0v_xm4tqQSfombk-lw9rS0eQiPDg7_tO-GHxdFPaOR0wHqwdDyCRgYbZZPAZ/pub?gid=434015411&single=true&output=csv" \
            --output "$RUNNER_TEMP/corsari_connessioni.csv"

          test -s "$RUNNER_TEMP/corsari_nodi.csv"
          test -s "$RUNNER_TEMP/corsari_connessioni.csv"
          head -n 1 "$RUNNER_TEMP/corsari_nodi.csv" | grep -Eqi '(^|,)id(,|$)'

          mv "$RUNNER_TEMP/corsari_nodi.csv" data/corsari_nodi.csv
          mv "$RUNNER_TEMP/corsari_connessioni.csv" data/corsari_connessioni.csv

      - name: Pubblica i dati aggiornati
        shell: bash
        run: |
          set -euo pipefail
          git add data/corsari_nodi.csv data/corsari_connessioni.csv
          if git diff --cached --quiet; then
            echo "I dati sono già aggiornati."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna dati rete corsari"
          git push
