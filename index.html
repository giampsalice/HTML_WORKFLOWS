<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Programma AIUCD</title>
<link rel="icon" href="data:,">

<style>
  /* ============================================================
     SEZIONE 1 - VARIABILI GRAFICHE GENERALI
     ============================================================

     Qui puoi modificare velocemente colori, ombre, raggi dei bordi,
     sfondo e colore principale senza cercare in tutto il CSS.

     Esempio:
       --accent controlla il blu principale dei pulsanti attivi,
       dei codici sessione e delle etichette.

       --radius controlla l'arrotondamento generale delle card.

       --shadow controlla l'ombra delle card.
  */
  :root {
    --bg: #f5f6fa;                 /* Colore di sfondo generale della pagina */
    --card: #ffffff;               /* Colore di sfondo delle card */
    --text: #1d2433;               /* Colore principale del testo */
    --muted: #677089;              /* Colore dei testi secondari */
    --line: #e6e9f0;               /* Colore dei bordi e delle linee */
    --accent: #2047d2;             /* Colore principale: pulsanti, codici, tag */
    --accent-soft: #edf2ff;        /* Sfondo chiaro dei tag standard */
    --ok: #0a7d48;                 /* Colore per plenarie o elementi positivi */
    --warn: #8f5b00;               /* Colore per pause/break */
    --social: #6943d0;             /* Colore per eventi sociali */
    --shadow: 0 6px 20px rgba(0,0,0,0.05); /* Ombra delle card */
    --radius: 18px;                /* Arrotondamento standard */
  }

  /* box-sizing rende più prevedibili larghezze, padding e bordi */
  * { box-sizing: border-box; }

  /* ============================================================
     SEZIONE 2 - STILE GENERALE DELLA PAGINA
     ============================================================ */
  body {
    font-family: Arial, sans-serif; /* Font generale di tutta la pagina */
    margin: 0;
    background: var(--bg);
    color: var(--text);
  }

  /* Contenitore principale della pagina.
     Per aumentare/ridurre la larghezza massima della pagina modifica max-width. */
  .wrap {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
  }

  /* ============================================================
     SEZIONE 3 - BARRA SUPERIORE: TITOLO + LINGUA
     ============================================================ */

  /* Griglia superiore: titolo a sinistra, selettore lingua a destra.
     grid-template-columns: 1fr auto significa:
       - il titolo prende tutto lo spazio disponibile;
       - il selettore lingua prende solo lo spazio necessario. */
  .toolbar {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
  }

  /* Card del titolo e card della lingua.
     Qui modifichi aspetto dei due blocchi in alto. */
  .titlebox, .langbox {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
  }

  /* Piccola etichetta sopra il titolo: "Programma" / "Language".
     Per modificarne dimensione, cambia font-size. */
  .eyebrow {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 6px;
  }

  /* Titolo principale della pagina.
     Modifica font-size per ingrandire o rimpicciolire il titolo. */
  h1 {
    margin: 0;
    font-size: 28px;
    line-height: 1.1;
  }

  /* Sottotitolo sotto h1: contiene la data formattata del giorno attivo. */
  .sub {
    margin-top: 6px;
    color: var(--muted);
    font-size: 14px;
  }

  /* Contenitore dei due pulsanti IT / EN */
  .lang-toggle {
    display: flex;
    gap: 8px;
  }

  /* ============================================================
     SEZIONE 4 - PULSANTI
     ============================================================

     Questo blocco stilizza:
       - pulsanti lingua IT/EN;
       - pulsanti dei giorni;
       - frecce avanti/indietro.
  */
  .lang-toggle button,
  .day-btn,
  .nav-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--text);
    border-radius: 999px;          /* 999px crea pulsanti a pillola */
    padding: 10px 14px;            /* Spazio interno del pulsante */
    font-weight: 600;
    cursor: pointer;
  }

  /* Stato attivo: lingua selezionata o giorno selezionato */
  .lang-toggle button.active,
  .day-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ============================================================
     SEZIONE 5 - NAVIGAZIONE GIORNI
     ============================================================ */
  .day-nav {
    display: grid;
    grid-template-columns: auto 1fr auto; /* freccia | giorni | freccia */
    gap: 10px;
    align-items: center;
    margin-bottom: 18px;
  }

  /* Contenitore dei pulsanti dei giorni */
  .day-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ============================================================
     SEZIONE 6 - STATISTICHE
     ============================================================

     Le statistiche sono le pillole sotto la navigazione:
       giorni, sessioni, momenti comuni, spazi.
  */
  .stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .pill {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--muted);
    box-shadow: var(--shadow);
  }

  .pill strong { color: var(--text); }

  /* ============================================================
     SEZIONE 7 - TIMELINE E BLOCCHI DEL PROGRAMMA
     ============================================================ */
  .timeline {
    display: grid;
    gap: 16px;
  }

  /* Card generale di un blocco orario */
  .block {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* Intestazione della card: titolo a sinistra e orario a destra */
  .block-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }

  /* Orario del blocco */
  .time {
    font-weight: 700;
    white-space: nowrap;
  }

  /* Etichetta del tipo di blocco: sessione, pausa, plenaria, evento sociale */
  .type {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 6px 10px;
  }

  /* Varianti cromatiche delle etichette */
  .type.break {
    background: #fff5e7;
    color: var(--warn);
  }

  .type.plenary {
    background: #ebf9f1;
    color: var(--ok);
  }

  .type.social {
    background: #f4efff;
    color: var(--social);
  }

  /* Titolo principale di un blocco orario.
     Per ingrandire/ridurre i titoli delle plenarie o sessioni parallele,
     modifica font-size. */
  .block-title {
    margin: 10px 0 0;
    font-size: 22px;
    line-height: 1.25;
  }

  /* Riga luogo/spazio */
  .location {
    margin-top: 8px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
    white-space: pre-line; /* mantiene gli a capo nei luoghi multipli */
  }

  /* ============================================================
     SEZIONE 8 - SESSIONI PARALLELE
     ============================================================ */

  /* Griglia delle aule/sessioni parallele.
     minmax(280px, 1fr) significa che ogni card aula ha larghezza minima 280px.
     Per card più larghe, aumenta 280px. */
  .parallel {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
    padding: 18px 20px 20px;
  }

  /* Singola card di una stanza/aula */
  .room-card {
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    background: #fcfdff;
  }

  /* Riga superiore della card aula: nome aula e codice sessione */
  .room-meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: baseline;
    margin-bottom: 10px;
  }

  /* Nome aula */
  .room-name {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    font-weight: 700;
  }

  /* Codice sessione, per esempio 1A, 2B, ecc. */
  .session-code {
    font-size: 13px;
    font-weight: 800;
    color: var(--accent);
  }

  /* Titolo della sessione nella singola aula */
  .session-title {
    margin: 0 0 6px;
    font-size: 18px;
    line-height: 1.3;
  }

  /* Riga chair.
     Attualmente molto piccola: font-size 10px.
     Se vuoi renderla più leggibile, prova 11px o 12px. */
  .chair-line {
    margin: 0 0 12px;
    font-size: 10px;
    line-height: 1.3;
    color: var(--muted);
    opacity: 0.9;
  }

  /* Lista degli interventi dentro una sessione */
  .talks {
    display: grid;
    gap: 10px;
  }

  /* Singolo intervento */
  .talk {
    border-top: 1px dashed #dfe4ee;
    padding-top: 10px;
  }

  /* Il primo intervento non ha bordo superiore */
  .talk:first-child {
    border-top: 0;
    padding-top: 0;
  }

  /* Orario dell'intervento */
  .talk-time {
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 4px;
  }

  /* Codice dell'intervento, per esempio #123 */
  .talk-code {
    font-size: 12px;
    color: var(--accent);
    font-weight: 800;
    margin-bottom: 4px;
  }

  /* Titolo dell'intervento */
  .talk-title {
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 4px;
  }

  /* Autori dell'intervento */
  .talk-authors {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.4;
  }

  /* ============================================================
     SEZIONE 9 - MESSAGGI DI CARICAMENTO / ERRORE
     ============================================================ */
  .loading, .error {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px;
    box-shadow: var(--shadow);
    color: var(--muted);
  }

  /* ============================================================
     SEZIONE 10 - RESPONSIVE
     ============================================================

     Queste regole si attivano su schermi stretti, per esempio smartphone.
  */
  @media (max-width: 860px) {
    .toolbar { grid-template-columns: 1fr; }
    .block-head { flex-direction: column; }
    .day-nav { grid-template-columns: 1fr; }
    .day-buttons { justify-content: flex-start; }
  }
</style>
</head>

<body>
<!-- ============================================================
     STRUTTURA HTML VISIBILE
     ============================================================

     In questa parte ci sono i contenitori della pagina.
     Il contenuto del programma viene generato dinamicamente da JavaScript
     dentro il div con id="app".
-->
<div class="wrap">
  <div class="toolbar">
    <div class="titlebox">
      <div class="eyebrow" id="eyebrow">Programma</div>
      <h1 id="pageTitle">AIUCD Cagliari 3-4-5 giugno 2026</h1>
      <div class="sub" id="pageSubtitle"></div>
    </div>

    <div class="langbox">
      <div class="eyebrow">Language</div>
      <div class="lang-toggle">
        <button id="btn-it" class="active">IT</button>
        <button id="btn-en">EN</button>
      </div>
    </div>
  </div>

  <div class="day-nav">
    <button class="nav-btn" id="prevDay">←</button>
    <div class="day-buttons" id="dayButtons"></div>
    <button class="nav-btn" id="nextDay">→</button>
  </div>

  <div class="stats" id="stats"></div>

  <div id="app" class="loading">Caricamento...</div>
</div>

<script>
/* ============================================================
   SEZIONE JS 1 - CONFIGURAZIONE
   ============================================================

   csvUrl:
     è il link pubblico CSV del Google Sheet.
     Per cambiare foglio, sostituisci questo URL.

   fallbackLocation:
     testo usato quando non viene trovato uno spazio/aula.
*/
const CONFIG = {
  csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRHVLopLKXErqwt8YOQBbUOTcYa7xNH7HmyT85pZpgQPQ88V7eYZFEY5IQ8T7uxMBH_dHsIF3wULWyY/pub?gid=352682787&single=true&output=csv",
  fallbackLocation: "Sede congressuale"
};

/* Stato dell'applicazione */
let currentLang = "it";      // Lingua corrente: "it" o "en"
let programmeDays = [];      // Array dei giorni del programma, costruito dal CSV
let activeDayIndex = 0;      // Giorno attualmente selezionato

/* ============================================================
   SEZIONE JS 2 - TESTI DELL'INTERFACCIA IT/EN
   ============================================================

   Qui puoi cambiare le etichette dell'interfaccia in italiano e inglese.
   La funzione t(key), più sotto, recupera il testo nella lingua corrente.
*/
const UI = {
  it: {
    eyebrow: "Programma",
    title: "AIUCD Cagliari 3-4-5 giugno 2026",
    loading: "Caricamento...",
    error: "Errore nel caricamento del programma.",
    session: "Sessione",
    parallelSessions: "Sessioni parallele",
    break: "Pausa",
    plenary: "Plenaria",
    social: "Evento sociale",
    discussion: "Dibattito",
    room: "Aula",
    location: "Spazio",
    chair: "Chair",
    days: "giorni",
    sessions: "sessioni",
    spaces: "spazi",
    shared: "momenti comuni"
  },
  en: {
    eyebrow: "Programme",
    title: "AIUCD Cagliari 2026 Programme",
    loading: "Loading...",
    error: "Error while loading the programme.",
    session: "Session",
    parallelSessions: "Parallel sessions",
    break: "Break",
    plenary: "Plenary",
    social: "Social event",
    discussion: "Discussion",
    room: "Room",
    location: "Location",
    chair: "Chair",
    days: "days",
    sessions: "sessions",
    spaces: "spaces",
    shared: "shared moments"
  }
};

/* Restituisce una parola/frase tradotta in base alla lingua corrente. */
function t(key) {
  return UI[currentLang][key] || key;
}

/* ============================================================
   SEZIONE JS 3 - LETTURA E PULIZIA CSV
   ============================================================ */

/*
  Parser CSV manuale.
  Serve perché i campi possono contenere virgole, a capo e virgolette.
*/
function parseCsv(text) {
  const rows = [];
  let row = [];
  let value = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i + 1];

    if (ch === '"') {
      if (inQuotes && next === '"') {
        value += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (ch === "," && !inQuotes) {
      row.push(value);
      value = "";
    } else if ((ch === "\n" || ch === "\r") && !inQuotes) {
      if (ch === "\r" && next === "\n") i++;
      row.push(value);
      rows.push(row);
      row = [];
      value = "";
    } else {
      value += ch;
    }
  }

  if (value.length || row.length) {
    row.push(value);
    rows.push(row);
  }

  return rows.map(r => r.map(c => (c || "").trim()));
}

/* Pulisce spazi, spazi non separabili e troppi a capo. */
function clean(v) {
  return (v || "")
    .replace(/\u00a0/g, " ")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

/* Variante compatta: trasforma gli a capo in spazi. */
function compact(v) {
  return clean(v).replace(/\n+/g, " ").replace(/\s{2,}/g, " ").trim();
}

/* Riconosce una data nel formato gg/mm/aaaa. */
function isDateCell(v) {
  return /^\d{2}\/\d{2}\/\d{4}$/.test(compact(v));
}

/* Normalizza gli orari.
   Esempi:
     09:00-10:00  -> 09:00–10:00
     09:00:10:00  -> 09:00–10:00
*/
function normalizeTime(v) {
  const s = compact(v);
  if (!s) return "";

  let m = s.match(/^(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})$/);
  if (m) return `${m[1]}–${m[2]}`;

  m = s.match(/^(\d{1,2}:\d{2}):(\d{1,2}:\d{2})$/);
  if (m) return `${m[1]}–${m[2]}`;

  return s;
}

/* Riconosce codici sessione tipo 1A, 2B, 3C. */
function isSessionCode(v) {
  return /^\d+[A-Z]$/i.test(compact(v));
}

/* Riconosce codici intervento numerici, per esempio 123. */
function isTalkCode(v) {
  return /^\d+$/.test(compact(v));
}

/* Riconosce le celle che iniziano con Chair. */
function isChairMarker(v) {
  return /^chair\b/i.test(compact(v));
}

/* Riconosce la parola Dibattito. */
function isDiscussion(v) {
  return /^dibattito$/i.test(compact(v));
}

/*
  Divide titolo e autori di un intervento.

  Formati supportati:
    Titolo | Autori

  oppure:
    Titolo
    Autori
*/
function splitTitleAuthors(value) {
  const raw = clean(value);
  if (!raw) return { title: "", authors: "" };

  const pipeIndex = raw.indexOf("|");
  if (pipeIndex >= 0) {
    return {
      title: clean(raw.slice(0, pipeIndex)),
      authors: clean(raw.slice(pipeIndex + 1))
    };
  }

  const lines = raw.split("\n").map(s => s.trim()).filter(Boolean);
  if (lines.length >= 2) {
    return {
      title: lines[0],
      authors: lines.slice(1).join("\n")
    };
  }

  return { title: raw, authors: "" };
}

/* Formatta una data gg/mm/aaaa in italiano o inglese. */
function formatDate(dateStr) {
  const [dd, mm, yyyy] = dateStr.split("/").map(Number);
  const d = new Date(yyyy, mm - 1, dd);
  return new Intl.DateTimeFormat(currentLang === "it" ? "it-IT" : "en-GB", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  }).format(d);
}

/* Classifica blocchi generali: pause, social, plenarie. */
function classifyGeneral(title) {
  const s = compact(title).toLowerCase();
  if (/pranzo|lunch/.test(s)) return "break";
  if (/pausa|caff[eè]|coffee|network caff[eè]|network caffe/.test(s)) return "break";
  if (/cena sociale|social dinner/.test(s)) return "social";
  return "plenary";
}

/* Rimuove duplicati e valori vuoti. */
function uniqueNonEmpty(values) {
  return [...new Set(values.map(clean).filter(Boolean))];
}

/* ============================================================
   SEZIONE JS 4 - MAPPATURA AULE / SPAZI
   ============================================================

   deriveColumnLocations:
     legge dalla prima riga del CSV i nomi degli spazi.

   officialLocationColumns:
     indica quali colonne contengono davvero i nomi degli spazi.
     Gli indici partono da 0:
       A = 0, B = 1, C = 2, D = 3, E = 4, ecc.
*/
function deriveColumnLocations(headerRow) {
  const locations = new Array(headerRow.length).fill("");

  locations[0] = "Data";
  locations[1] = "Orario";

  // Solo le colonne che contengono davvero i nomi degli spazi.
  // C, E, G, I, J, K.
  const officialLocationColumns = [2, 4, 6, 8, 9, 10];

  officialLocationColumns.forEach(idx => {
    locations[idx] = clean(headerRow[idx] || "");
  });

  return locations;
}

/*
  Risolve il nome dell'aula/spazio partendo dagli indici di colonna.

  Serve perché alcune sessioni usano coppie di colonne:
    D/E, F/G, H/I, ecc.
*/
function resolveLocationFromColumns(columnIndices, columnLocations) {
  const mapped = [];

  for (const i of columnIndices) {
    let sourceIndex = i;

    if (i === 3 || i === 4) sourceIndex = 4;       // D/E -> E
    else if (i === 5 || i === 6) sourceIndex = 6;  // F/G -> G
    else if (i === 7 || i === 8) sourceIndex = 8;  // H/I -> I
    else if (i === 9) sourceIndex = 9;             // J -> J
    else if (i === 10) sourceIndex = 10;           // K -> K
    else if (i === 2) sourceIndex = 2;             // C -> C

    const label = clean(columnLocations[sourceIndex] || "");
    if (label) mapped.push(label);
  }

  const labels = [...new Set(mapped)].filter(v => !/^(data|orario)$/i.test(v));
  return labels.join("\n") || CONFIG.fallbackLocation;
}

/* ============================================================
   SEZIONE JS 5 - COSTRUZIONE DEL PROGRAMMA
   ============================================================

   Questa è la parte più importante della logica.
   Prende le righe CSV e le trasforma in una struttura dati più comoda:

   programmeDays = [
     {
       date: "03/06/2026",
       blocks: [...]
     },
     ...
   ]
*/
function buildProgramme(rows) {
  if (!rows.length) return [];

  const headerRow = rows[0] || [];
  const columnLocations = deriveColumnLocations(headerRow);

  const days = [];
  let currentDay = null;
  let currentParallel = null;
  let lastDate = "";

  function startDay(date) {
    currentDay = {
      date,
      blocks: []
    };
    days.push(currentDay);
    currentParallel = null;
  }

  function pushGeneralBlock(time, title, cols) {
    currentParallel = null;
    currentDay.blocks.push({
      type: classifyGeneral(title),
      time,
      title: clean(title),
      location: resolveLocationFromColumns(cols, columnLocations)
    });
  }

  for (let rowIndex = 1; rowIndex < rows.length; rowIndex++) {
    const r = rows[rowIndex];
    if (!r || !r.some(cell => compact(cell))) continue;

    const dateCell = compact(r[0] || "");
    const time = normalizeTime(r[1] || "");
    const general = clean(r[2] || "");

    if (isDateCell(dateCell)) {
      lastDate = dateCell;
      if (!currentDay || currentDay.date !== dateCell) startDay(dateCell);
    } else if (!currentDay && lastDate) {
      startDay(lastDate);
    }

    if (!currentDay) continue;

    // Le sessioni parallele sono organizzate a coppie di colonne.
    const pairStarts = [];
    for (let i = 3; i < r.length; i += 2) pairStarts.push(i);

    const nonEmptyCols = [];
    for (let i = 0; i < r.length; i++) {
      if (compact(r[i])) nonEmptyCols.push(i);
    }

    const hasPairData = pairStarts.some(i => compact(r[i]) || compact(r[i + 1]));

    // Attività generale in colonna C.
    // Esempio: pausa, pranzo, plenaria, cena sociale.
    if (general && !hasPairData) {
      pushGeneralBlock(time, general, [2]);
      continue;
    }

    // Inizio nuova sessione parallela.
    // Viene riconosciuta se in una colonna di coppia compare un codice tipo 1A.
    const sessionPairs = pairStarts.filter(i => isSessionCode(r[i]));
    if (sessionPairs.length > 0) {
      currentParallel = {
        type: "parallel",
        time,
        title: t("parallelSessions"),
        rooms: []
      };

      for (const i of sessionPairs) {
        const sessionCode = compact(r[i] || "");
        const sessionTitle = clean(r[i + 1] || "");
        currentParallel.rooms.push({
          pairIndex: i,
          roomName: resolveLocationFromColumns([i, i + 1], columnLocations),
          code: sessionCode,
          title: sessionTitle,
          chair: "",
          talks: []
        });
      }

      currentDay.blocks.push(currentParallel);
      continue;
    }

    // Riga Chair.
    if (currentParallel) {
      const hasChairMarkers = currentParallel.rooms.some(room =>
        isChairMarker(r[room.pairIndex]) || isChairMarker(r[room.pairIndex + 1])
      );

      if (hasChairMarkers) {
        for (const room of currentParallel.rooms) {
          const left = compact(r[room.pairIndex] || "");
          const right = clean(r[room.pairIndex + 1] || "");

          if (isChairMarker(left) && right) {
            room.chair = right.replace(/^chair\s*:?\s*/i, "").trim();
          } else if (isChairMarker(right)) {
            room.chair = right.replace(/^chair\s*:?\s*/i, "").trim();
          }
        }
        continue;
      }
    }

    // Riga dibattito.
    if (currentParallel) {
      const hasDiscussion = currentParallel.rooms.some(room =>
        isDiscussion(r[room.pairIndex + 1] || "")
      );

      if (hasDiscussion) {
        for (const room of currentParallel.rooms) {
          const text = clean(r[room.pairIndex + 1] || "");
          if (isDiscussion(text)) {
            room.talks.push({
              time,
              code: "",
              title: t("discussion"),
              authors: ""
            });
          }
        }
        continue;
      }
    }

    // Riga intervento.
    if (currentParallel) {
      let hasTalkData = false;

      for (const room of currentParallel.rooms) {
        const code = compact(r[room.pairIndex] || "");
        const text = clean(r[room.pairIndex + 1] || "");

        if (!code && !text) continue;
        hasTalkData = true;

        if (!text) continue;

        const parsed = splitTitleAuthors(text);
        room.talks.push({
          time,
          code: isTalkCode(code) ? code : "",
          title: parsed.title,
          authors: parsed.authors
        });
      }

      if (hasTalkData) continue;
    }

    // Fallback per pause/plenarie replicate su più colonne.
    if (nonEmptyCols.length) {
      const fallbackTexts = nonEmptyCols
        .filter(i => i >= 2)
        .map(i => clean(r[i]))
        .filter(Boolean);

      if (fallbackTexts.length) {
        const title = general || fallbackTexts[0];
        pushGeneralBlock(time, title, nonEmptyCols);
      }
    }
  }

  return days;
}

/* ============================================================
   SEZIONE JS 6 - RENDERING STATISTICHE E PULSANTI GIORNO
   ============================================================ */
function renderStats(day) {
  const stats = document.getElementById("stats");
  const sessionCount = day.blocks
    .filter(b => b.type === "parallel")
    .reduce((sum, b) => sum + b.rooms.length, 0);

  const sharedCount = day.blocks.filter(b => b.type !== "parallel").length;
  const spaces = new Set();

  day.blocks.forEach(block => {
    if (block.type === "parallel") {
      block.rooms.forEach(r => spaces.add(r.roomName));
    } else if (block.location) {
      block.location.split("\n").forEach(loc => spaces.add(loc));
    }
  });

  stats.innerHTML = `
    <div class="pill"><strong>${programmeDays.length}</strong> ${t("days")}</div>
    <div class="pill"><strong>${sessionCount}</strong> ${t("sessions")}</div>
    <div class="pill"><strong>${sharedCount}</strong> ${t("shared")}</div>
    <div class="pill"><strong>${spaces.size}</strong> ${t("spaces")}</div>
  `;
}

function renderDayButtons() {
  const box = document.getElementById("dayButtons");
  box.innerHTML = programmeDays.map((day, index) => `
    <button class="day-btn ${index === activeDayIndex ? "active" : ""}" data-day-index="${index}">
      ${formatDate(day.date)}
    </button>
  `).join("");

  box.querySelectorAll("[data-day-index]").forEach(btn => {
    btn.addEventListener("click", () => {
      activeDayIndex = Number(btn.dataset.dayIndex);
      render();
    });
  });
}

/* ============================================================
   SEZIONE JS 7 - RENDERING DEI BLOCCHI DEL PROGRAMMA
   ============================================================ */
function renderBlock(block) {
  // Rendering delle sessioni parallele.
  if (block.type === "parallel") {
    return `
      <section class="block">
        <div class="block-head">
          <div>
            <div class="type">${t("session")}</div>
            <h2 class="block-title">${t("parallelSessions")}</h2>
          </div>
          <div class="time">${block.time || ""}</div>
        </div>

        <div class="parallel">
          ${block.rooms.map(room => `
            <article class="room-card">
              <div class="room-meta">
                <div class="room-name">${room.roomName}</div>
                <div class="session-code">${room.code}</div>
              </div>

              <h3 class="session-title">${room.title}</h3>
              <div class="location">${t("location")}: ${room.roomName}</div>
              ${room.chair ? `<div class="chair-line">${t("chair")}: ${room.chair}</div>` : ""}

              <div class="talks">
                ${room.talks.map(talk => `
                  <div class="talk">
                    <div class="talk-time">${talk.time || ""}</div>
                    ${talk.code ? `<div class="talk-code">#${talk.code}</div>` : ""}
                    <div class="talk-title">${talk.title || ""}</div>
                    ${talk.authors ? `<div class="talk-authors">${talk.authors}</div>` : ""}
                  </div>
                `).join("")}
              </div>
            </article>
          `).join("")}
        </div>
      </section>
    `;
  }

  // Rendering di pause, plenarie, eventi sociali.
  return `
    <section class="block">
      <div class="block-head">
        <div>
          <div class="type ${block.type}">${block.type === "break" ? t("break") : block.type === "social" ? t("social") : t("plenary")}</div>
          <h2 class="block-title">${block.title || ""}</h2>
          <div class="location">${t("location")}: ${block.location || CONFIG.fallbackLocation}</div>
        </div>
        <div class="time">${block.time || ""}</div>
      </div>
    </section>
  `;
}

/* ============================================================
   SEZIONE JS 8 - CARICAMENTO PROGRAMMA
   ============================================================ */
async function loadProgramme() {
  const app = document.getElementById("app");
  app.className = "loading";
  app.textContent = t("loading");

  try {
    // Date.now() evita che il browser usi una vecchia versione del CSV in cache.
    const res = await fetch(CONFIG.csvUrl + "&t=" + Date.now(), { cache: "no-store" });
    const text = await res.text();
    const rows = parseCsv(text);
    programmeDays = buildProgramme(rows);

    if (!programmeDays.length) {
      app.className = "error";
      app.textContent = t("error");
      return;
    }

    if (activeDayIndex >= programmeDays.length) activeDayIndex = 0;
    render();
  } catch (e) {
    app.className = "error";
    app.textContent = t("error");
  }
}

/* ============================================================
   SEZIONE JS 9 - RENDER COMPLESSIVO
   ============================================================ */
function render() {
  document.getElementById("eyebrow").textContent = t("eyebrow");
  document.getElementById("pageTitle").textContent = t("title");

  renderDayButtons();

  const day = programmeDays[activeDayIndex];
  document.getElementById("pageSubtitle").textContent = formatDate(day.date);
  renderStats(day);

  const app = document.getElementById("app");
  app.className = "timeline";
  app.innerHTML = day.blocks.map(renderBlock).join("");
}

/* Cambia lingua e ricarica il programma. */
function setLanguage(lang) {
  currentLang = lang;
  document.getElementById("btn-it").classList.toggle("active", lang === "it");
  document.getElementById("btn-en").classList.toggle("active", lang === "en");
  loadProgramme();
}

/* ============================================================
   SEZIONE JS 10 - EVENTI UTENTE
   ============================================================ */
document.getElementById("btn-it").addEventListener("click", () => setLanguage("it"));
document.getElementById("btn-en").addEventListener("click", () => setLanguage("en"));

document.getElementById("prevDay").addEventListener("click", () => {
  if (!programmeDays.length) return;
  activeDayIndex = Math.max(0, activeDayIndex - 1);
  render();
});

document.getElementById("nextDay").addEventListener("click", () => {
  if (!programmeDays.length) return;
  activeDayIndex = Math.min(programmeDays.length - 1, activeDayIndex + 1);
  render();
});

/* Carica il programma al primo avvio. */
loadProgramme();

/* Ricarica automaticamente il programma ogni 5 minuti.
   300000 millisecondi = 5 minuti.
   Se non vuoi aggiornamento automatico, cancella o commenta questa riga. */
setInterval(loadProgramme, 300000);
</script>

<script>
/* ============================================================
   SEZIONE JS 11 - RIDIMENSIONAMENTO IFRAME
   ============================================================

   Questo blocco serve se la pagina viene incorporata dentro un iframe.
   Invia alla pagina genitore l'altezza del contenuto.

   Se non usi iframe, puoi anche lasciarlo: non crea problemi.
*/
function sendHeight() {
  const height = document.body.scrollHeight;
  window.parent.postMessage({ type: "resize-iframe", height: height }, "*");
}

// Invia altezza al caricamento.
window.addEventListener("load", sendHeight);

// Invia altezza quando cambia contenuto.
const observer = new MutationObserver(sendHeight);
observer.observe(document.body, { childList: true, subtree: true });

// Invia altezza anche al resize della finestra.
window.addEventListener("resize", sendHeight);
</script>
