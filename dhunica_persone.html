  <script>
  (() => {
    'use strict';
    const CONFIG = {
      ...DIRECTORY_OPTIONS,
      // Colonne escluse da filtri, profili e ricerca (il CSV originale non viene modificato).
      excludedFields: [
        'telefono', 'numero di telefono', 'numero telefono', 'tel', 'cellulare',
        'phone', 'phone number', 'telephone', 'mobile',
        'interesse di ricerca', 'interessi di ricerca', 'interesse ricerca', 'interessi ricerca',
        'research interest', 'research interests',
        'approvato', 'approved', 'email', 'e-mail', 'indirizzo email', 'indirizzo e-mail',
        'email address'
      ],
      csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTXzXVD97NxAGmhibLmX3OkOIf7pH7ybu3VmChRQAM5MCaCC3aj-NADoG1cv2yNSL9IUItRzYmcmCyP/pub?gid=0&single=true&output=csv',
      refreshMs: 300000,
      allBatchSize: 72,
      // I nomi sono riconosciuti dagli header, NON dalle posizioni delle colonne.
      aliases: {
        name: ['nome','nome e cognome','nominativo','cognome e nome','name','full name','person','persona'],
        role: ['ruolo','qualifica','role','position','posizione'],
        dept: ['dipartimento','department','dept'],
        area: ['ambito','area','ambito scientifico','research area'],
        special: ['incarico','incarichi','incarico speciale','ruolo speciale','special role','special assignment','special','funzione'],
        image: ['immagine','immagine url','url immagine','foto','foto url','url foto','image','image url','photo','photo url','avatar','link immagine'],
        page: ['pagina','pagina web','pagina istituzionale','sito web','profilo web','url pagina','page url','website','web page','link pagina','url profilo','link profilo','profilo url']
      }
    };
    const COPY = {
      it: {title:'CONSIGLIO DEL CENTRO',subtitle:'DH UNICA · Componenti del Consiglio del Centro',language:'Lingua',featuredKicker:'In evidenza',featuredTitle:'Direzione e coordinamento',featuredSubtitle:'Figure di riferimento e incarichi speciali.',search:'Cerca in tutti i campi',searchPlaceholder:'Nome, ruolo, dipartimento, ambito, progetto...',sort:'Ordina per',sortAZ:'Nome A–Z',sortZA:'Nome Z–A',sortRelevance:'Rilevanza',sortRole:'Ruolo / incarico',reset:'Azzera filtri',filters:'Filtra per campo',filterNote:'I filtri si combinano tra loro',all:'Tutti',perPage:'Per pagina',view:'Vista',grid:'Griglia',list:'Lista',allPeople:'Tutte le persone',loading:'Caricamento dei dati...',error:'Non è stato possibile caricare il CSV. Verifica la pubblicazione del foglio e l’URL.',empty:'Nessun profilo corrisponde alla ricerca.',profiles:'profili',visible:'risultati',of:'di',profile:'Vedi profilo completo',director:'Direttore',coordinator:'Coordinatore',special:'Incarico speciale',prev:'Precedente',next:'Successiva',more:'Mostra altri risultati',close:'Chiudi',openPage:'Apri pagina istituzionale',page:'Pagina web',image:'Immagine',updated:'Dati aggiornati',updateError:'Aggiornamento non riuscito: rimangono visibili i dati precedenti.',dataError:'CSV senza intestazioni o senza una colonna riconoscibile per il nome.',name:'Nome',role:'Ruolo',dept:'Dipartimento',area:'Ambito',assignment:'Incarico',showing:'Visualizzati',noData:'—'},
      en: {title:'DH UNICA BOARD',subtitle:'DH UNICA · Board members',language:'Language',featuredKicker:'Featured',featuredTitle:'Leadership and coordination',featuredSubtitle:'Key people and special assignments.',search:'Search all fields',searchPlaceholder:'Name, role, department, area, project...',sort:'Sort by',sortAZ:'Name A–Z',sortZA:'Name Z–A',sortRelevance:'Relevance',sortRole:'Role / assignment',reset:'Reset filters',filters:'Filter by field',filterNote:'Filters can be combined',all:'All',perPage:'Per page',view:'View',grid:'Grid',list:'List',allPeople:'All people',loading:'Loading data...',error:'Could not load the CSV. Check the published sheet and URL.',empty:'No profiles match your search.',profiles:'profiles',visible:'results',of:'of',profile:'View full profile',director:'Director',coordinator:'Coordinator',special:'Special assignment',prev:'Previous',next:'Next',more:'Show more results',close:'Close',openPage:'Open institutional page',page:'Web page',image:'Image',updated:'Data updated',updateError:'Refresh failed: previously loaded data remains visible.',dataError:'CSV has no headers or no recognizable name column.',name:'Name',role:'Role',dept:'Department',area:'Area',assignment:'Assignment',showing:'Showing',noData:'—'}
    };
    const $ = id => document.getElementById(id);
    $('directory-heading').hidden = !CONFIG.showHeader;
    const state = {lang:'it',headers:[],items:[],matches:[],featured:[],regular:[],filters:new Map(),search:'',sort:'name-asc',view:'grid',size:'12',page:1,renderCount:72,modalId:null,loading:false,lastFocus:null,galleryScroll:null,loadError:false};
    const collator = () => new Intl.Collator(state.lang,{sensitivity:'base',numeric:true});
    const t = key => COPY[state.lang][key] || key;
    const norm = value => String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().replace(/\s+/g,' ').trim();
    const clean = value => String(value ?? '').trim();
    const fieldKey = value => norm(value).replace(/[^a-z0-9]/g,'');
    const excludedFieldKeys = new Set(CONFIG.excludedFields.map(fieldKey));
    const excludedField = header => excludedFieldKeys.has(fieldKey(header));
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeUrl = value => { try {const u = new URL(clean(value));return ['https:','http:'].includes(u.protocol) ? u.href : '';}catch{return '';} };
    const imageHeader = header => /(^|\b)(immagine|foto|image|photo|avatar|portrait|thumbnail)(\b|$)/i.test(norm(header));
    const linkHeader = header => /(^|\b)(url|link|website|web|sito|pagina|page|profilo web)(\b|$)/i.test(norm(header));
    const isUrlHeader = header => imageHeader(header) || linkHeader(header);
    const kindOf = header => {
      const h=norm(header);
      const exact=Object.keys(CONFIG.aliases).find(kind=>CONFIG.aliases[kind].some(alias=>norm(alias)===h));
      if(exact)return exact;
      if(/(?:nome.*cognome|cognome.*nome|nominativo|full.?name|person name)/.test(h))return 'name';
      if(/(?:foto|immagine|image|photo|avatar|portrait)/.test(h))return 'image';
      if(/(?:url|link|pagina|website|sito web)/.test(h)&&/(?:profilo|pagina|istituzional|web|site|personale|personal)/.test(h))return 'page';
      if(/(?:dipartiment|department)/.test(h))return 'dept';
      if(/(?:incaric|special assignment|special role)/.test(h))return 'special';
      if(/(?:ambito|research area)/.test(h))return 'area';
      if(/(?:ruolo|qualifica|role|position)/.test(h))return 'role';
      return '';
    };
    function parseCsv(input){
      const text=String(input).replace(/^\uFEFF/,''); const rows=[];let row=[],cell='',quoted=false;
      for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}
        else if(ch===','&&!quoted){row.push(cell);cell='';}
        else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row);row=[];cell='';}
        else cell+=ch;
      }
      if(cell!==''||row.length){row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row);}
      return rows;
    }
    function classify(item){
      const sources=[item.role,item.special].filter(Boolean).join(' ');const text=norm(sources);
      if(/\b(direttore|direttrice|director|directrice)\b/.test(text))return 'director';
      if(/\b(coordinatore|coordinatrice|coordinator|coordination)\b/.test(text))return 'coordinator';
      if(item.special)return 'special';return '';
    }
    const priority = item => ({director:0,coordinator:1,special:2})[item.featureType] ?? 3;
    // Accetta URL diretti e link condivisi; non usa proxy esterni.
    function imageCandidates(value){
      let raw=clean(value).replace(/&amp;/gi,'&');
      if(raw.startsWith('//'))raw='https:'+raw;
      else if(/^www\./i.test(raw))raw='https://'+raw;
      const direct=safeUrl(raw);if(!direct)return [];
      const url=new URL(direct);
      if(url.hostname==='drive.google.com'){
        const id=url.pathname.match(/^\/file\/d\/([a-zA-Z0-9_-]+)/)?.[1] || url.searchParams.get('id');
        if(id && /^[a-zA-Z0-9_-]+$/.test(id)){
          const thumb=new URL('https://drive.google.com/thumbnail');
          thumb.searchParams.set('id',id);thumb.searchParams.set('sz','w400');
          const resourceKey=url.searchParams.get('resourcekey');
          if(resourceKey)thumb.searchParams.set('resourcekey',resourceKey);
          return [thumb.href,direct];
        }
      }
      return [direct];
    }
    function processCsv(text){
      const rows=parseCsv(text);if(!rows.length)throw new Error(t('dataError'));
      const rawHeaders=rows.shift().map(clean);const seen=new Map();const headers=rawHeaders.map((name,index)=>{
        const base=name || `Colonna ${index+1}`;const n=(seen.get(base)||0)+1;seen.set(base,n);return {id:`col${index}`,label:n===1?base:`${base} (${n})`,source:base,index,kind:kindOf(base),isUrl:isUrlHeader(base)};
      }).filter(header=>!excludedField(header.source));
      const locate=kind=>headers.find(h=>h.kind===kind);
      // Preferisce “url immagine”, ma cerca anche nelle altre colonne foto.
      const imageColumns=headers.filter(h=>h.kind==='image').sort((a,b)=>{
        const rank=h=>['url immagine','image url','url foto','photo url'].includes(norm(h.source))?0:1;
        return rank(a)-rank(b);
      });
      const nameCol=locate('name');if(!nameCol)throw new Error(t('dataError'));
      const get=(fields,kind)=>{const col=locate(kind);return col?fields[col.index]||'':'';};
      const items=rows.map((row,index)=>{
        const values=Object.fromEntries(headers.map(h=>[h.id,clean(row[h.index])]));
        const images=[...new Set(imageColumns.flatMap(h=>imageCandidates(row[h.index])))];
        const item={id:index,name:clean(get(row,'name')),role:clean(get(row,'role')),dept:clean(get(row,'dept')),area:clean(get(row,'area')),special:clean(get(row,'special')),imageUrl:images[0]||'',imageCandidates:images,pageUrl:safeUrl(get(row,'page')),values};
        item.featureType=classify(item);item.searchText=norm(Object.values(values).join(' '));return item;
      }).filter(item=>item.name);
      return {headers,items};
    }
    function initials(name){return (clean(name).split(/\s+/).filter(Boolean).slice(0,2).map(s=>Array.from(s)[0]).join('') || '?').toLocaleUpperCase();}
    function avatarHtml(item,cls='',eager=false){
      // Gli errori sono gestiti con eventi, anche quando gli handler inline sono bloccati.
      return `<span class="avatar ${cls}" aria-hidden="true"><span>${escapeHtml(initials(item.name))}</span>${item.imageUrl?`<img src="${escapeHtml(item.imageUrl)}" data-avatar-id="${item.id}" alt="" loading="${eager?'eager':'lazy'}" decoding="async" referrerpolicy="no-referrer">`:''}</span>`;
    }
    document.addEventListener('error',event=>{
      const img=event.target;
      if(!(img instanceof HTMLImageElement)||!img.hasAttribute('data-avatar-id'))return;
      const item=state.items.find(person=>String(person.id)===img.dataset.avatarId);
      const candidates=item?.imageCandidates||[];
      let attempt=Number(img.dataset.imageAttempt||0)+1;
      img.dataset.imageAttempt=String(attempt);
      // Ritenta una sola volta per URL con il referrer limitato all’origine.
      const candidate=candidates[Math.floor(attempt/2)];
      if(candidate){
        img.referrerPolicy=attempt%2?'strict-origin-when-cross-origin':'no-referrer';
        img.src=candidate;
      }else{
        img.parentElement.dataset.imageStatus='unavailable';
        console.warn('[DH UNICA directory] Foto non caricata:',item?.name||img.dataset.avatarId,
          'Verificare che il link restituisca un’immagine pubblica e che il sito consenta il caricamento.');
        img.remove();
      }
    },true);
    document.addEventListener('load',event=>{
      const img=event.target;
      if(img instanceof HTMLImageElement && img.hasAttribute('data-avatar-id')){
        img.parentElement.dataset.imageStatus='loaded';
      }
    },true);
    function badge(item){const key=item.featureType;if(!key)return '';return `<span class="badge ${key}">${escapeHtml(key==='special'?(item.special||t('special')):t(key))}</span>`;}
    function featureCard(item){return `<button class="feature-card" type="button" data-profile="${item.id}" aria-label="${escapeHtml(t('profile')+': '+item.name)}">${avatarHtml(item,'large')}<span class="feature-copy">${badge(item)}<h3>${escapeHtml(item.name)}</h3><p>${escapeHtml(item.role||item.special||'')}</p><p>${escapeHtml(item.dept)}</p></span></button>`;}
    function personCard(item){return `<article class="profile-card" data-profile="${item.id}" tabindex="0" role="button" aria-label="${escapeHtml(t('profile')+': '+item.name)}"><div class="card-top">${avatarHtml(item)}<div><h3 class="card-name">${escapeHtml(item.name)}</h3>${item.role?`<p class="card-role">${escapeHtml(item.role)}</p>`:''}</div></div><div class="card-meta">${item.dept?`<div class="meta-line"><strong>${escapeHtml(t('dept'))}:</strong> ${escapeHtml(item.dept)}</div>`:''}${item.area?`<div class="meta-line"><strong>${escapeHtml(t('area'))}:</strong> ${escapeHtml(item.area)}</div>`:''}${item.special?`<div class="meta-line">${badge(item)} ${escapeHtml(item.special)}</div>`:''}</div><div class="card-footer"><span class="smallnote">${escapeHtml(item.dept?'DH UNICA':'')}</span><span class="secondary" aria-hidden="true">${escapeHtml(t('profile'))} →</span></div></article>`;}
    function listHtml(items){return `<div class="table-shell"><table class="people-table"><thead><tr><th scope="col">${t('name')}</th><th scope="col">${t('role')}</th><th scope="col">${t('dept')}</th><th scope="col">${t('area')}</th><th scope="col">${t('assignment')}</th><th scope="col"><span class="sr-only">${t('profile')}</span></th></tr></thead><tbody>${items.map(item=>`<tr><td><div class="table-person">${avatarHtml(item)}<button type="button" data-profile="${item.id}">${escapeHtml(item.name)}</button></div></td><td>${escapeHtml(item.role||'—')}</td><td>${escapeHtml(item.dept||'—')}</td><td>${escapeHtml(item.area||'—')}</td><td>${badge(item)} ${escapeHtml(item.special||'')}</td><td class="table-action"><button type="button" class="secondary" data-profile="${item.id}">${t('profile')} →</button></td></tr>`).join('')}</tbody></table></div>`;}
    function renderFilters(){
      const target=$('dynamic-filters');const old=state.filters;const next=new Map();
      const html=state.headers.filter(h=>!h.isUrl).map(h=>{
        const values=[...new Set(state.items.map(item=>item.values[h.id]).filter(Boolean))].sort(collator().compare);
        if(!values.length)return '';
        const selected=values.includes(old.get(h.id))?old.get(h.id):'';if(selected)next.set(h.id,selected);
        return `<div class="field"><label for="filter-${h.id}" title="${escapeHtml(h.label)}">${escapeHtml(h.label)}</label><select id="filter-${h.id}" data-filter="${h.id}"><option value="">${escapeHtml(t('all'))} · ${escapeHtml(h.label)}</option>${values.map(v=>`<option value="${escapeHtml(v)}" ${selected===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select></div>`;
      }).join('');state.filters=next;target.innerHTML=html;
    }
    function relevance(item){if(!state.search)return 0;const q=norm(state.search);const n=norm(item.name);if(n===q)return 100;if(n.startsWith(q))return 70;if(n.includes(q))return 50;if(norm(item.role).includes(q))return 30;if(norm(item.special).includes(q))return 25;return 10;}
    function sortItems(items){const c=collator();const sort=state.sort;return items.sort((a,b)=>{
      if(sort==='name-desc')return c.compare(b.name,a.name);
      if(sort==='role')return c.compare(a.role||a.special,b.role||b.special)||c.compare(a.name,b.name);
      if(sort==='relevance')return relevance(b)-relevance(a)||priority(a)-priority(b)||c.compare(a.name,b.name);
      return c.compare(a.name,b.name);
    });}
    function applyFilters(resetPage=true){
      const q=norm(state.search);
      state.matches=state.items.filter(item=>(!q||item.searchText.includes(q))&&[...state.filters].every(([key,value])=>!value||item.values[key]===value));
      state.featured=state.matches.filter(i=>i.featureType).sort((a,b)=>priority(a)-priority(b)||collator().compare(a.name,b.name));
      state.regular=sortItems(state.matches.filter(i=>!i.featureType));
      if(resetPage){state.page=1;state.renderCount=CONFIG.allBatchSize;}
      renderFeatured();renderResults();
    }
    function renderFeatured(){const visible=state.featured.length>0;$('featured-section').hidden=!visible;$('featured-grid').innerHTML=visible?state.featured.map(featureCard).join(''):'';}
    function pageWindow(count){const current=state.page;const pages=new Set([1,count,current,current-1,current+1,current-2,current+2]);return [...pages].filter(n=>n>=1&&n<=count).sort((a,b)=>a-b);}
    function renderPagination(totalPages){const box=$('pagination');box.hidden=state.size==='all'||totalPages<2;if(box.hidden){box.innerHTML='';return;}
      let html=`<button type="button" data-page="${state.page-1}" ${state.page===1?'disabled':''}>← ${t('prev')}</button>`;let previous=0;
      for(const n of pageWindow(totalPages)){if(n-previous>1)html+='<span aria-hidden="true">…</span>';html+=`<button type="button" data-page="${n}" ${n===state.page?'aria-current="page"':''} aria-label="${n}">${n}</button>`;previous=n;}
      html+=`<button type="button" data-page="${state.page+1}" ${state.page===totalPages?'disabled':''}>${t('next')} →</button>`;box.innerHTML=html;
    }
    function renderResults(){const total=state.regular.length,all=state.size==='all',size=all?state.renderCount:Number(state.size),totalPages=all?1:Math.max(1,Math.ceil(total/size));state.page=Math.min(Math.max(state.page,1),totalPages);
      const offset=all?0:(state.page-1)*size;const shown=state.regular.slice(offset,all?size:offset+size);const results=$('results');
      if(!state.matches.length){results.innerHTML=`<div class="notice">${t('empty')}</div>`;}
      else if(!total){results.innerHTML=`<div class="notice">${state.lang==='it'?'Tutti i risultati sono nella sezione in evidenza.':'All matching profiles are in the featured section.'}</div>`;}
      else{results.innerHTML=state.view==='grid'?`<div class="people-grid">${shown.map(personCard).join('')}</div>`:listHtml(shown);}
      $('statistics').innerHTML=`<strong>${state.matches.length}</strong> ${t('visible')} ${t('of')} <strong>${state.items.length}</strong> ${t('profiles')} · <strong>${state.featured.length}</strong> ${t('featuredKicker').toLowerCase()}`;
      $('result-range').textContent=total?`${t('showing')} ${offset+1}–${offset+shown.length} ${t('of')} ${total}`:'';
      renderPagination(totalPages);$('load-more').hidden=!all||shown.length>=total;$('load-more').textContent=t('more');
    }
    function openModal(id,opener=null){const item=state.items.find(i=>i.id===Number(id));if(!item)return;
      if(state.modalId===null){
        state.lastFocus=opener||document.activeElement;
        state.galleryScroll={left:window.scrollX,top:window.scrollY};
      }
      state.modalId=item.id;
      const modal=$('modal-body');modal.innerHTML=`<div class="modal-identity">${avatarHtml(item,'modal-avatar',true)}<div>${badge(item)}<h2 id="modal-title">${escapeHtml(item.name)}</h2><p>${escapeHtml(item.role||'')}</p></div></div><dl class="details-grid">${state.headers.filter(h=>h.kind!=='image' && !imageHeader(h.source)).map(h=>{
        const value=item.values[h.id];if(!value)return '';const url=h.isUrl?safeUrl(value):'';
        return `<div class="detail"><dt>${escapeHtml(h.label)}</dt><dd>${url?`<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(value)} ↗</a>`:escapeHtml(value)}</dd></div>`;
      }).join('')}</dl>${item.pageUrl?`<div class="modal-actions"><a class="primary" href="${escapeHtml(item.pageUrl)}" rel="noopener noreferrer" target="_blank">${t('openPage')} ↗</a></div>`:''}`;
      $('modal-backdrop').hidden=false;document.body.classList.add('modal-open');document.querySelector('main.wrap').inert=true;$('modal-close').focus({preventScroll:true});
    }
    function closeModal(){
      if(state.modalId===null)return;
      $('modal-backdrop').hidden=true;
      document.body.classList.remove('modal-open');
      document.querySelector('main.wrap').inert=false;
      state.modalId=null;
      if(state.lastFocus?.isConnected)state.lastFocus.focus({preventScroll:true});
      if(state.galleryScroll)window.scrollTo({...state.galleryScroll,behavior:'instant'});
      state.galleryScroll=null;
      state.lastFocus=null;
    }
    function setLanguage(lang){if(!COPY[lang])return;state.lang=lang;document.documentElement.lang=lang;$('lang-it').setAttribute('aria-pressed',String(lang==='it'));$('lang-en').setAttribute('aria-pressed',String(lang==='en'));
      const bindings={'page-title':'title','page-subtitle':'subtitle','language-label':'language','featured-kicker':'featuredKicker','featured-title':'featuredTitle','featured-subtitle':'featuredSubtitle','search-label':'search','sort-label':'sort','reset-button':'reset','filters-title':'filters','filter-note':'filterNote','page-size-label':'perPage','view-label':'view','grid-label':'grid','list-label':'list','all-title':'allPeople','modal-close':'close'};
      for(const [id,key] of Object.entries(bindings))$(id).textContent=t(key);$('search-input').placeholder=t('searchPlaceholder');$('modal-close').setAttribute('aria-label',t('close'));$('sort-select').options[0].text=t('sortAZ');$('sort-select').options[1].text=t('sortZA');$('sort-select').options[2].text=t('sortRelevance');$('sort-select').options[3].text=t('sortRole');
      if(state.items.length){renderFilters();applyFilters(false);}else $('initial-loading') && ($('initial-loading').textContent=state.loadError?t('error'):t('loading'));
      if(state.modalId!==null)openModal(state.modalId);
      try{localStorage.setItem('dhunica-directory-lang',lang);}catch{}
    }
    async function loadData(initial=false){if(state.loading)return;state.loading=true;const hadData=state.items.length>0;
      if(initial&&!hadData){$('results').innerHTML=`<div class="notice" id="initial-loading">${t('loading')}</div>`;}
      try{
        const url=new URL(CONFIG.csvUrl);url.searchParams.set('_ts',Date.now());const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);
        const data=processCsv(await response.text());state.headers=data.headers;state.items=data.items;state.loadError=false;
        if(state.modalId!==null)closeModal();renderFilters();applyFilters(!hadData);$('refresh-note').textContent='';
      }catch(err){console.error('[DH UNICA directory]',err);state.loadError=true;if(!hadData){$('results').innerHTML=`<div class="notice error">${escapeHtml(t('error'))}<br><small>${escapeHtml(err.message)}</small></div>`;}else $('refresh-note').textContent=t('updateError');}
      finally{state.loading=false;}
    }
    function debounce(fn,ms){let handle;return (...args)=>{clearTimeout(handle);handle=setTimeout(()=>fn(...args),ms);};}
    $('search-input').addEventListener('input',debounce(e=>{state.search=e.target.value;applyFilters();},180));
    $('dynamic-filters').addEventListener('change',e=>{const key=e.target.dataset.filter;if(!key)return;if(e.target.value)state.filters.set(key,e.target.value);else state.filters.delete(key);applyFilters();});
    $('sort-select').addEventListener('change',e=>{state.sort=e.target.value;applyFilters();});
    $('page-size').addEventListener('change',e=>{state.size=e.target.value;state.page=1;state.renderCount=CONFIG.allBatchSize;renderResults();});
    $('reset-button').addEventListener('click',()=>{state.search='';state.filters.clear();state.sort='name-asc';$('search-input').value='';$('sort-select').value='name-asc';renderFilters();applyFilters();});
    function changeView(view){state.view=view;$('view-grid').setAttribute('aria-pressed',String(view==='grid'));$('view-list').setAttribute('aria-pressed',String(view==='list'));renderResults();}
    $('view-grid').addEventListener('click',()=>changeView('grid'));$('view-list').addEventListener('click',()=>changeView('list'));
    $('lang-it').addEventListener('click',()=>setLanguage('it'));$('lang-en').addEventListener('click',()=>setLanguage('en'));
    $('pagination').addEventListener('click',e=>{const btn=e.target.closest('[data-page]');if(!btn||btn.disabled)return;state.page=Number(btn.dataset.page);renderResults();$('all-title').scrollIntoView({block:'start',behavior:'smooth'});});
    $('load-more').addEventListener('click',()=>{state.renderCount+=CONFIG.allBatchSize;renderResults();});
    document.addEventListener('click',e=>{const target=e.target.closest('[data-profile]');if(target)openModal(target.dataset.profile,target);});
    document.addEventListener('keydown',e=>{if(state.modalId!==null){if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){
      const focusables=[...$('profile-modal').querySelectorAll('a[href],button:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(el=>el.getClientRects().length);
      if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
    }return;}const card=e.target.closest('.profile-card[data-profile]');if(card&&(e.key==='Enter'||e.key===' ')){if(e.target.closest('button,a,select,input'))return;e.preventDefault();openModal(card.dataset.profile,card);}});
    $('modal-close').addEventListener('click',closeModal);$('modal-backdrop').addEventListener('click',e=>{if(e.target===$('modal-backdrop'))closeModal();});
    let savedLang='it';try{savedLang=localStorage.getItem('dhunica-directory-lang')||'it';}catch{}setLanguage(savedLang);loadData(true);if(CONFIG.refreshMs>0)setInterval(()=>{if(!document.hidden)loadData();},CONFIG.refreshMs);
  })();
  </script>
