<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rassegna stampa AIUCD 2026</title>

  <style>
    :root {
      --rs-card: #ffffff;
      --rs-text: #1f2937;
      --rs-muted: #667085;
      --rs-border: #e5e7eb;
      --rs-accent: #1d4ed8;
      --rs-accent-soft: #eef4ff;
      --rs-date-bg: #f3f4f6;
      --rs-date-text: #4b5563;
      --rs-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      --rs-radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      color: var(--rs-text);
    }

    .rassegna-stampa-aiucd26 {
      max-width: 1100px;
      margin: 0 auto;
      padding: 42px 18px;
    }

    .rs-intro {
      text-align: center;
      margin-bottom: 34px;
    }

    .rs-topbar {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .rs-lang-switch {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border: 1px solid var(--rs-border);
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
    }

    .rs-lang-button {
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      background: transparent;
      color: var(--rs-muted);
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .rs-lang-button.is-active {
      background: var(--rs-accent);
      color: #ffffff;
    }

    .rs-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--rs-accent-soft);
      color: var(--rs-accent);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .rs-eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--rs-accent);
    }

    .rs-intro h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      letter-spacing: -0.04em;
      color: #111827;
    }

    .rs-intro p {
      max-width: 620px;
      margin: 16px auto 0;
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--rs-muted);
    }

    .rs-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      padding: 14px 16px;
      border: 1px solid var(--rs-border);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
    }

    .rs-count {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--rs-muted);
    }

    .rs-search {
      width: min(360px, 100%);
      border: 1px solid var(--rs-border);
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 0.95rem;
      outline: none;
      background: #ffffff;
      color: var(--rs-text);
    }

    .rs-search:focus {
      border-color: var(--rs-accent);
      box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.12);
    }

    .rs-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .rs-card {
      position: relative;
      min-height: 245px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      border: 1px solid var(--rs-border);
      border-radius: var(--rs-radius);
      background:
        radial-gradient(circle at top right, rgba(29, 78, 216, 0.10), transparent 36%),
        var(--rs-card);
      box-shadow: var(--rs-shadow);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .rs-card:hover {
      transform: translateY(-5px);
      border-color: rgba(29, 78, 216, 0.35);
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.13);
    }

    .rs-card a {
      min-height: 245px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      color: inherit;
      text-decoration: none;
    }

    .rs-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }

    .rs-testata {
      max-width: 100%;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--rs-accent-soft);
      color: var(--rs-accent);
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rs-data {
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--rs-date-bg);
      color: var(--rs-date-text);
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .rs-title {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.32;
      letter-spacing: -0.02em;
      color: #111827;
    }

    .rs-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: 24px;
      color: var(--rs-muted);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .rs-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #111827;
      color: #ffffff;
      transition: transform 0.22s ease;
    }

    .rs-card:hover .rs-arrow {
      transform: translateX(3px);
    }

    .rs-state {
      grid-column: 1 / -1;
      padding: 34px 20px;
      border: 1px dashed #cbd5e1;
      border-radius: 20px;
      background: #ffffff;
      text-align: center;
      color: var(--rs-muted);
      font-weight: 600;
    }

    .rs-error {
      color: #b42318;
      border-color: #fecdca;
      background: #fff5f5;
    }

    .rs-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .rs-page-button,
    .rs-page-arrow {
      min-width: 42px;
      height: 42px;
      border: 1px solid var(--rs-border);
      border-radius: 999px;
      background: #ffffff;
      color: var(--rs-text);
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .rs-page-button:hover,
    .rs-page-arrow:hover {
      border-color: rgba(29, 78, 216, 0.45);
      transform: translateY(-2px);
    }

    .rs-page-button.is-active {
      background: var(--rs-accent);
      border-color: var(--rs-accent);
      color: #ffffff;
    }

    .rs-page-arrow {
      padding: 0 16px;
    }

    .rs-page-arrow:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }

    .rs-page-info {
      width: 100%;
      margin-top: 8px;
      text-align: center;
      color: var(--rs-muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    @media (max-width: 900px) {
      .rs-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .rassegna-stampa-aiucd26 {
        padding: 28px 12px;
      }

      .rs-intro {
        text-align: left;
        margin-bottom: 24px;
      }

      .rs-topbar {
        justify-content: flex-start;
      }

      .rs-intro p {
        margin-left: 0;
      }

      .rs-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .rs-grid {
        grid-template-columns: 1fr;
      }

      .rs-card,
      .rs-card a {
        min-height: 210px;
      }

      .rs-card a {
        padding: 19px;
      }

      .rs-title {
        font-size: 1.08rem;
      }

      .rs-page-button,
      .rs-page-arrow {
        min-width: 38px;
        height: 38px;
        font-size: 0.86rem;
      }
    }
  </style>
</head>

<body>
  <main class="rassegna-stampa-aiucd26">
    <section class="rs-intro">
      <div class="rs-topbar">
        <div class="rs-lang-switch" aria-label="Selettore lingua">
          <button id="rs-lang-it" class="rs-lang-button is-active" type="button">IT</button>
          <button id="rs-lang-en" class="rs-lang-button" type="button">EN</button>
        </div>
      </div>

      <div id="rs-eyebrow" class="rs-eyebrow">Rassegna stampa</div>

      <h1 id="rs-main-title">Dicono di noi</h1>

      <p id="rs-main-subtitle">
        Una raccolta aggiornata di articoli, segnalazioni e uscite stampa dedicate ad AIUCD 2026.
      </p>
    </section>

    <section class="rs-toolbar">
      <div id="rs-count" class="rs-count">Caricamento articoli…</div>

      <input
        id="rs-search"
        class="rs-search"
        type="search"
        placeholder="Cerca per titolo, testata o data"
        aria-label="Cerca nella rassegna stampa"
      >
    </section>

    <section id="rs-grid" class="rs-grid">
      <div class="rs-state">Caricamento rassegna stampa…</div>
    </section>

    <nav id="rs-pagination" class="rs-pagination" aria-label="Paginazione rassegna stampa"></nav>
  </main>

  <script>
    /*
      ============================================================
      LINK CSV DEL GOOGLE SHEET
      ============================================================
      Il foglio deve avere queste colonne:

      Titolo | testata | link | data

      Titoli degli articoli e nomi delle testate NON vengono tradotti.
      Viene tradotta solo l'interfaccia della rassegna stampa.
    */

    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTOdD9r0Df4QYR_OceikJDAbsXq4h2B9K0w7d7GgNLeddbopanFw6RRtFlPZVO4ZQp7qYMP7KPdS0cw/pub?gid=1417877873&single=true&output=csv";

    const ITEMS_PER_PAGE = 10;

    const grid = document.getElementById("rs-grid");
    const count = document.getElementById("rs-count");
    const search = document.getElementById("rs-search");
    const pagination = document.getElementById("rs-pagination");

    const langIt = document.getElementById("rs-lang-it");
    const langEn = document.getElementById("rs-lang-en");

    const eyebrow = document.getElementById("rs-eyebrow");
    const mainTitle = document.getElementById("rs-main-title");
    const mainSubtitle = document.getElementById("rs-main-subtitle");

    let currentLang = "it";
    let currentPage = 1;
    let articoli = [];
    let risultatiCorrenti = [];

    const TEXTS = {
      it: {
        htmlLang: "it",
        pageTitle: "Rassegna stampa AIUCD 2026",
        langLabel: "Selettore lingua",
        paginationLabel: "Paginazione rassegna stampa",
        eyebrow: "Rassegna stampa",
        title: "Dicono di noi",
        subtitle: "Una raccolta aggiornata di articoli, segnalazioni e uscite stampa dedicate ad AIUCD 2026.",
        loadingCount: "Caricamento articoli…",
        loadingState: "Caricamento rassegna stampa…",
        searchPlaceholder: "Cerca per titolo, testata o data",
        searchAria: "Cerca nella rassegna stampa",
        oneArticle: "1 articolo",
        manyArticles: "articoli",
        noResults: "Nessun risultato trovato.",
        readArticle: "Leggi l’articolo",
        previous: "Precedente",
        next: "Successiva",
        page: "Pagina",
        of: "di",
        showing: "Visualizzati",
        from: "di",
        errorTitle: "Errore nel caricamento della rassegna stampa.",
        errorText: "Verifica che il foglio abbia le colonne: Titolo, testata, link, data."
      },
      en: {
        htmlLang: "en",
        pageTitle: "AIUCD 2026 Press Review",
        langLabel: "Language selector",
        paginationLabel: "Press review pagination",
        eyebrow: "Press review",
        title: "They talk about us",
        subtitle: "An updated collection of articles, mentions and press coverage dedicated to AIUCD 2026.",
        loadingCount: "Loading articles…",
        loadingState: "Loading press review…",
        searchPlaceholder: "Search by title, outlet or date",
        searchAria: "Search the press review",
        oneArticle: "1 article",
        manyArticles: "articles",
        noResults: "No results found.",
        readArticle: "Read the article",
        previous: "Previous",
        next: "Next",
        page: "Page",
        of: "of",
        showing: "Showing",
        from: "of",
        errorTitle: "Error loading the press review.",
        errorText: "Please check that the sheet has the columns: Titolo, testata, link, data."
      }
    };

    function t(key) {
      return TEXTS[currentLang][key];
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let current = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && insideQuotes && next === '"') {
          current += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          row.push(current.trim());
          current = "";
        } else if ((char === "\n" || char === "\r") && !insideQuotes) {
          if (current || row.length) {
            row.push(current.trim());
            rows.push(row);
            row = [];
            current = "";
          }

          if (char === "\r" && next === "\n") {
            i++;
          }
        } else {
          current += char;
        }
      }

      if (current || row.length) {
        row.push(current.trim());
        rows.push(row);
      }

      return rows;
    }

    function normalizza(value) {
      return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, "")
        .replace(/[àá]/g, "a")
        .replace(/[èé]/g, "e")
        .replace(/[ìí]/g, "i")
        .replace(/[òó]/g, "o")
        .replace(/[ùú]/g, "u");
    }

    function escapeHTML(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function parseData(value) {
      const raw = String(value || "").trim();

      if (!raw) {
        return 0;
      }

      /*
        Formati italiani:
        29/05/2026
        29-05-2026
        29.05.2026
      */
      let match = raw.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);

      if (match) {
        const giorno = parseInt(match[1], 10);
        const mese = parseInt(match[2], 10) - 1;
        const anno = parseInt(match[3], 10);

        return new Date(anno, mese, giorno).getTime();
      }

      /*
        Formati ISO:
        2026-05-29
        2026/05/29
        2026.05.29
      */
      match = raw.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);

      if (match) {
        const anno = parseInt(match[1], 10);
        const mese = parseInt(match[2], 10) - 1;
        const giorno = parseInt(match[3], 10);

        return new Date(anno, mese, giorno).getTime();
      }

      /*
        Eventuale numero seriale esportato da Google Sheets / Excel.
      */
      if (/^\d+(\.\d+)?$/.test(raw)) {
        const seriale = parseFloat(raw);

        if (seriale > 20000 && seriale < 80000) {
          const excelEpoch = new Date(1899, 11, 30);
          return excelEpoch.getTime() + seriale * 24 * 60 * 60 * 1000;
        }
      }

      const fallback = new Date(raw).getTime();

      return Number.isNaN(fallback) ? 0 : fallback;
    }

    function formattaData(value) {
      const raw = String(value || "").trim();

      if (!raw) {
        return "";
      }

      const timestamp = parseData(raw);

      if (!timestamp) {
        return raw;
      }

      const locale = currentLang === "it" ? "it-IT" : "en-GB";

      return new Intl.DateTimeFormat(locale, {
        day: "2-digit",
        month: "long",
        year: "numeric"
      }).format(new Date(timestamp));
    }

    function aggiornaInterfaccia() {
      document.documentElement.lang = t("htmlLang");
      document.title = t("pageTitle");

      eyebrow.textContent = t("eyebrow");
      mainTitle.textContent = t("title");
      mainSubtitle.textContent = t("subtitle");

      search.placeholder = t("searchPlaceholder");
      search.setAttribute("aria-label", t("searchAria"));

      document.querySelector(".rs-lang-switch").setAttribute("aria-label", t("langLabel"));
      pagination.setAttribute("aria-label", t("paginationLabel"));

      langIt.classList.toggle("is-active", currentLang === "it");
      langEn.classList.toggle("is-active", currentLang === "en");

      articoli = articoli.map(item => {
        return {
          ...item,
          dataFormattata: formattaData(item.dataOriginale)
        };
      });

      applicaFiltro();
    }

    function aggiornaConteggio(lista) {
      if (lista.length === 1) {
        count.textContent = t("oneArticle");
      } else {
        count.textContent = lista.length + " " + t("manyArticles");
      }
    }

    function render(lista) {
      risultatiCorrenti = lista;

      if (!lista.length) {
        grid.innerHTML = '<div class="rs-state">' + t("noResults") + '</div>';
        count.textContent = "0 " + t("manyArticles");
        pagination.innerHTML = "";
        return;
      }

      aggiornaConteggio(lista);

      const totalPages = Math.ceil(lista.length / ITEMS_PER_PAGE);

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      if (currentPage < 1) {
        currentPage = 1;
      }

      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const end = start + ITEMS_PER_PAGE;
      const pagina = lista.slice(start, end);

      grid.innerHTML = pagina.map(item => {
        const titolo = escapeHTML(item.titolo);
        const testata = escapeHTML(item.testata);
        const data = escapeHTML(item.dataFormattata);
        const link = escapeHTML(item.link);

        return `
          <article class="rs-card">
            <a href="${link}" target="_blank" rel="noopener noreferrer">
              <div>
                <div class="rs-meta">
                  <div class="rs-testata">${testata}</div>
                  ${data ? `<div class="rs-data">${data}</div>` : ""}
                </div>

                <h2 class="rs-title">${titolo}</h2>
              </div>

              <div class="rs-bottom">
                <span>${t("readArticle")}</span>
                <span class="rs-arrow" aria-hidden="true">→</span>
              </div>
            </a>
          </article>
        `;
      }).join("");

      renderPaginazione(totalPages, lista.length, start, Math.min(end, lista.length));
    }

    function renderPaginazione(totalPages, totalItems, startIndex, endIndex) {
      if (totalPages <= 1) {
        pagination.innerHTML = `
          <div class="rs-page-info">
            ${t("showing")} ${startIndex + 1}-${endIndex} ${t("from")} ${totalItems}
          </div>
        `;
        return;
      }

      let buttons = "";

      buttons += `
        <button class="rs-page-arrow" type="button" data-page="${currentPage - 1}" ${currentPage === 1 ? "disabled" : ""}>
          ${t("previous")}
        </button>
      `;

      for (let i = 1; i <= totalPages; i++) {
        buttons += `
          <button class="rs-page-button ${i === currentPage ? "is-active" : ""}" type="button" data-page="${i}" aria-label="${t("page")} ${i}">
            ${i}
          </button>
        `;
      }

      buttons += `
        <button class="rs-page-arrow" type="button" data-page="${currentPage + 1}" ${currentPage === totalPages ? "disabled" : ""}>
          ${t("next")}
        </button>
      `;

      buttons += `
        <div class="rs-page-info">
          ${t("page")} ${currentPage} ${t("of")} ${totalPages} · ${t("showing")} ${startIndex + 1}-${endIndex} ${t("from")} ${totalItems}
        </div>
      `;

      pagination.innerHTML = buttons;

      pagination.querySelectorAll("button[data-page]").forEach(button => {
        button.addEventListener("click", () => {
          const nuovaPagina = parseInt(button.getAttribute("data-page"), 10);

          if (!Number.isNaN(nuovaPagina)) {
            currentPage = nuovaPagina;
            render(risultatiCorrenti);
            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });
          }
        });
      });
    }

    function applicaFiltro() {
      const q = search.value.toLowerCase().trim();

      if (!q) {
        render(articoli);
        return;
      }

      const filtrati = articoli.filter(item => {
        return item.titolo.toLowerCase().includes(q) ||
               item.testata.toLowerCase().includes(q) ||
               item.dataOriginale.toLowerCase().includes(q) ||
               item.dataFormattata.toLowerCase().includes(q);
      });

      render(filtrati);
    }

    function cambiaLingua(lang) {
      currentLang = lang;
      currentPage = 1;
      aggiornaInterfaccia();
    }

    async function carica() {
      try {
        count.textContent = t("loadingCount");
        grid.innerHTML = '<div class="rs-state">' + t("loadingState") + '</div>';

        const response = await fetch(CSV_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Errore HTTP " + response.status);
        }

        const text = await response.text();
        const rows = parseCSV(text);

        if (!rows || rows.length < 2) {
          throw new Error("Il foglio è vuoto oppure non contiene righe dati.");
        }

        const headers = rows[0].map(normalizza);

        const titoloIndex = headers.indexOf("titolo");
        const testataIndex = headers.indexOf("testata");
        const linkIndex = headers.indexOf("link");

        let dataIndex = headers.indexOf("data");

        if (dataIndex === -1) {
          dataIndex = headers.indexOf("date");
        }

        if (
          titoloIndex === -1 ||
          testataIndex === -1 ||
          linkIndex === -1 ||
          dataIndex === -1
        ) {
          throw new Error("Colonne obbligatorie non trovate. Servono: Titolo, testata, link, data.");
        }

        articoli = rows.slice(1)
          .map(row => {
            const dataOriginale = row[dataIndex] || "";
            const timestamp = parseData(dataOriginale);

            return {
              titolo: row[titoloIndex] || "",
              testata: row[testataIndex] || "",
              link: row[linkIndex] || "",
              dataOriginale: dataOriginale,
              dataTimestamp: timestamp,
              dataFormattata: formattaData(dataOriginale)
            };
          })
          .filter(item => item.titolo && item.testata && item.link)
          .sort((a, b) => {
            return b.dataTimestamp - a.dataTimestamp;
          });

        currentPage = 1;
        render(articoli);

      } catch (error) {
        console.error("Errore rassegna stampa:", error);

        grid.innerHTML = `
          <div class="rs-state rs-error">
            ${t("errorTitle")}
            <br>
            ${t("errorText")}
          </div>
        `;

        count.textContent = t("errorTitle");
        pagination.innerHTML = "";
      }
    }

    search.addEventListener("input", () => {
      currentPage = 1;
      applicaFiltro();
    });

    langIt.addEventListener("click", () => {
      cambiaLingua("it");
    });

    langEn.addEventListener("click", () => {
      cambiaLingua("en");
    });

    carica();
  </script>
</body>
</html>
